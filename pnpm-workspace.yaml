packages:
  - "apps/*"
  - "packages/*"

# Packages allowed to run install scripts.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@scarf/scarf"
  - bcrypt
  - esbuild
  - unrs-resolver

ignoredBuiltDependencies:
  - sharp

# Patched versions of build-time deps pulled in via next > styled-jsx.
overrides:
  "@babel/core@<7.29.6": ^7.29.6
  browserslist@<4.28.7: ^4.28.7
  baseline-browser-mapping@<2.11.0: ^2.11.0
